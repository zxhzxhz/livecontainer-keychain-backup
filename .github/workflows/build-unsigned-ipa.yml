name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build .app (no sign)
        run: |
          set -eux
          xcodebuild \
            -project LCKeychainBackup/LCKeychainBackup.xcodeproj \
            -scheme LCKeychainBackup \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build
          APP_PATH=$(find build/DerivedData -name "LCKeychainBackup.app" -type d | head -n 1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Found app at: $APP_PATH"
          ls -la "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          set -eux
          rm -rf Payload LCKeychainBackup-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # 去掉可能残留的签名再压包，保证是干净的 no-sign 包
          codesign --remove-signature "Payload/LCKeychainBackup.app" || true
          zip -r -y LCKeychainBackup-unsigned.ipa Payload
          ls -lh LCKeychainBackup-unsigned.ipa
          unzip -l LCKeychainBackup-unsigned.ipa | head -n 30

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LCKeychainBackup-unsigned
          path: LCKeychainBackup-unsigned.ipa
          if-no-files-found: error
